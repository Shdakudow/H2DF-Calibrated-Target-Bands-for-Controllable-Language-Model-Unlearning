[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2df-unlearning"
version = "0.1.0"
description = "Calibrated target-distribution language-model unlearning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<5",
  "numpy>=1.26,<3",
  "peft>=0.14,<1",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "torch>=2.2",
  "transformers>=4.47,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
h2df-calibrate = "h2df.calibrate:main"
h2df-train = "h2df.train:main"
h2df-evaluate = "h2df.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

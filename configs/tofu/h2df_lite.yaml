experiment:
  task: tofu
  seed: 42

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  base_adapter: outputs/tofu/sft/seed_42/adapter
  dtype: bfloat16
  gradient_checkpointing: true
  trust_remote_code: false

lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  forget:
    path: locuslab/TOFU
    name: forget05
    split: train
  retain:
    path: locuslab/TOFU
    name: retain95
    split: "train[10%:]"
  calibration:
    path: locuslab/TOFU
    name: retain95
    split: "train[:10%]"
  question_column: question
  answer_column: answer
  prompt_template: "Question: {question}\nAnswer:"

calibration:
  output_dir: artifacts/tofu/sft_seed_42
  batch_size: 4
  bins: 4
  min_bin_size: 20
  rho: 0.7
  delta_min: 0.5

method:
  name: h2df_lite
  tau: 0.25
  gamma: 0.0
  lora_lambda: 0.0001
  retain_beta: 1.0
  retain_every: 10
  beta: 0.1
  simnpo_gamma: 0.0
  rmu_layer: 14
  steering_coefficient: 20.0
  control_seed_offset: 10000

training:
  batch_size: 4
  retain_batch_size: 4
  gradient_accumulation_steps: 1
  max_length: 512
  max_steps: 500
  learning_rate: 0.0001
  weight_decay: 0.0
  max_grad_norm: 1.0
  scheduler: cosine
  warmup_steps: 25
  mixed_precision: bf16
  num_workers: 0

evaluation:
  batch_size: 4
  max_new_tokens: 64
  generate_qa: true

output:
  dir: outputs/tofu/h2df_lite_from_sft/seed_42
  log_every: 10
  save_every: 100
